name: Feature or improvement
description: Suggest something the project should do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward, slow or impossible today? Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: Your suggested change, if you have one in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you ruled out, and why. Useful even when brief.
    validations:
      required: false
